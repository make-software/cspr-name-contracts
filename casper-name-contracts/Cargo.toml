[package]
name = "casper-name-contracts"
version = "0.1.0"
edition = "2021"

[dependencies]
odra = { path = "../../odra3/odra",  features = [], default-features = false }
odra-modules = { path = "../../odra3/modules", features = [], default-features = false }
hex = { version = "0.4.3", default-features = false }
serde = { version = "1.0.80", default-features = false }
serde-json-wasm = { version = "1.0.1", default-features = false }
hifijson = "0.2.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { path = "../../odra3/odra-build" }

[dev-dependencies]
odra-test = {  path = "../../odra3/odra-test" , features = [], default-features = false }
blake2 = "0.10.6"
hex = "0.4.3"

[build-dependencies]
odra-build = {  path = "../../odra3/odra-build" , features = [], default-features = false }

[[bin]]
name = "casper_name_contracts_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "casper-name-contracts_build_schema"
path = "bin/build_schema.rs"
test = false

[[bin]]
name = "structs-as-bytes"
path = "bin/structs_as_bytes.rs"
test = false

[[bin]]
name = "serialize-structs"
path = "bin/serialize_structs.rs"
test = false

# [[test]]
