[package]
name = "casper-name-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
casper-name-contracts = { path = "../casper-name-contracts" }
clap = { version = "4.5.4", features = ["derive"] }
prettycli = "0.1.1"
# odra = { version = "1.3.0", features = [], default-features = false }
# odra-casper-livenet-env = { version = "1.3.0" }
odra = { path = "../../../odra/odra/odra", features = [], default-features = false }
odra-casper-livenet-env = { path = "../../../odra/odra/odra-casper/livenet-env" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_derive = { version = "1.0", features = ["default"] }
serde_json = "1.0"
toml = "0.8.13"
blake2 = "0.10.6"
hex = "0.4.3"
# odra-cli = { git = "https://github.com/odradev/odra-cli" }
odra-cli = { path = "../../../odra/odra/odra-cli" }

[[bin]]
name = "casper-name-cli"
path = "bin/main.rs"