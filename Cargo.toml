[workspace]
members = [
    "casper-name-cli",
    "casper-name-contracts",
]

resolver = "2"

[workspace.dependencies]
odra = { version = "2.8.1" }
odra-cli = { version = "2.8.1" }
odra-modules = { version = "2.8.1" }
odra-test = { version = "2.8.1" }
odra-build = { version = "2.8.1" }
odra-bdd = { version = "2.8.1" }
odra-casper-livenet-env = { version = "2.8.1" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
opt-level = "z"
strip = true

[profile.dev.package."*"]
opt-level = 3
